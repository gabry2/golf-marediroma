name: Test sicurezza database
# Esegue i test delle regole Firestore e del sito su Firebase Emulator (progetto finto "demo-golf"):
# nessun accesso al database vero.
on:
  push:
    branches: [main, sicurezza]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund && node --test orari.test.mjs
        working-directory: promemoria
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: risultati-test
          path: |
            test/risultati/
            test/*.log
          if-no-files-found: ignore
