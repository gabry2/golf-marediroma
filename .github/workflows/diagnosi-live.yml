name: Diagnosi sito pubblicato
# Apre il sito pubblicato come un visitatore e riporta errori. Sola lettura.
on:
  workflow_dispatch:
  push:
    branches: [sicurezza]
    paths: ['test/diagnosi-live.mjs', '.github/workflows/diagnosi-live.yml']
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node diagnosi-live.mjs
